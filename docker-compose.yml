version: '3.8'

services:
  # PostgreSQL database (optional - backend defaults to H2 if not configured)
  postgres:
    image: postgres:16-alpine
    container_name: appointment-postgres
    environment:
      POSTGRES_DB: appointmentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appointment-backend
    ports:
      - "8080:8080"
    environment:
      # Defaults to H2 in-memory. To use PostgreSQL instead, uncomment:
      # SPRING_PROFILES_ACTIVE: postgres
      # SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appointmentdb
      # SPRING_DATASOURCE_USERNAME: postgres
      # SPRING_DATASOURCE_PASSWORD: postgres
      APP_JWT_SECRET: MzA2NzI5NTM0MzUzNzY2NTM0MzUzNzY2NTM0MzUzNzY2NTM0MzUzNzY2NTM0MzUzNzY2NQ==
      APP_JWT_EXPIRATION_MS: 86400000
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend (built with Vite, served via nginx, proxies /api to backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appointment-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
