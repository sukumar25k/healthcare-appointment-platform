server:
  port: 8080

spring:
  application:
    name: appointment-platform

  # ---- Default profile uses H2 (in-memory) ----
  datasource:
    url: jdbc:h2:mem:appointmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

app:
  jwt:
    # Base64-encoded 256-bit secret. Override via APP_JWT_SECRET env var in production.
    secret: ${APP_JWT_SECRET:MzA2NzI5NTM0MzUzNzY2NTM0MzUzNzY2NTM0MzUzNzY2NTM0MzUzNzY2NTM0MzUzNzY2NQ==}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.healthcare.appointment: INFO
